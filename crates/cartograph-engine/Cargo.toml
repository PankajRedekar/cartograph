[package]
name = "cartograph-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
cartograph-core = { path = "../cartograph-core" }
cartograph-ast = { path = "../cartograph-ast" }
cartograph-db = { path = "../cartograph-db" }
ignore = "0.4"
notify = "6.1"
rayon = "1.10"
tokio = { version = "1.43", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "signal"] }
sha2 = "0.10"
memmap2 = "0.9"
crossbeam-channel = "0.5"
parking_lot = "0.12"
lru = "0.13"
tracing = "0.1"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.25"
regex = "1.11"
colored = "2.1"
globset = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3.17"
