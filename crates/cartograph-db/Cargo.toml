[package]
name = "cartograph-db"
version = "0.2.0"
edition = "2024"

[dependencies]
cartograph-core = { path = "../cartograph-core" }
rusqlite = { version = "0.33", features = ["bundled", "bundled-full"] }
tokio = { version = "1.43", features = ["rt", "sync", "macros"] }
tempfile = "3.17"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
parking_lot = "0.12"
